<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3eee2">
  <meta name="description" content="逐句译 · Translate Study — 哈利波特英文原著逐句英译中练习，段落级 AI 批改，本地单用户。">
  <title>逐句译 · Translate Study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4d3f'/%3E%3Cpath d='M32 8l4.9 13.7L50 27l-13.1 5.3L32 46l-4.9-13.7L14 27l13.1-5.3z' fill='%23f3eee2'/%3E%3Cpath d='M41 39l-10 17 6.6-1.1-3.2 8.1 11.5-16.4-6.3 1z' fill='%23d3ac68'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* 主题/字号在首屏渲染前应用，避免闪烁（与 js/store.js 中 key 保持一致） */
    (function () {
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem('zs.theme');
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        else root.dataset.theme = mql.matches ? 'dark' : 'light';
        var scale = parseFloat(localStorage.getItem('zs.fontScale'));
        if (isFinite(scale) && scale >= 0.8 && scale <= 1.4) {
          root.style.setProperty('--reading-scale', String(scale));
        }
      } catch (e) { /* 隐私模式下 localStorage 不可用时静默降级 */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app-root">
    <div class="boot-loading" role="status" aria-live="polite">
      <span class="boot-mark" aria-hidden="true"></span>
      <p>正在翻开书页…</p>
    </div>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div class="boot-loading"><p>逐句译需要启用 JavaScript 才能使用。</p></div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
